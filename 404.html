:"Los botones de estado con franja roja requieren atención antes de procesar muestras."},{title:"Verifica contenedores externos",text:"En la pestaña General, pulsa el botón de estado de fluidos y comprueba agua, residuos y agente limpiador.",image:"cobas-c111/modulo-1/comprobar-botellas.png"},{title:"Verifica segmentos de cubetas y mantenimiento",text:"Revisa la disponibilidad de cubetas en el rotor y ejecuta las tareas pendientes en la lista de Mantenimiento.",image:"cobas-c111/modulo-1/cubetas.png",note:"Recuerda confirmar en pantalla cada acción realizada."}]},Sg={scenario:"Inicias el turno de la mañana en el laboratorio clínico. El analizador acaba de encender y se encuentra en la pantalla General en estado En espera, pero observas franjas rojas en los indicadores de estado.",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-1/pantalla-general.png",prompt:"Acabas de iniciar sesión con tu usuario en la pantalla General. ¿Qué acción debes realizar antes de cargar muestras?",choices:[{label:"Seleccionar el asistente Preparar / revisar botones de estado con alerta",correct:!0,next:"s2",feedback:"¡Correcto! Antes de procesar muestras debes revisar los botones de estado (fluidos, cubetas, reactivos y mantenimiento) o iniciar el asistente Preparar."},{label:"Colocar los tubos de muestra de inmediato en las 8 posiciones",correct:!1,feedback:"Incorrecto. No debes cargar muestras mientras existan alertas de preparación o fluidos pendientes."},{label:"Pulsar Fin turno para reiniciar los contadores",correct:!1,feedback:"Incorrecto. Fin turno se utiliza al cierre de la jornada, no al inicio."}]},{id:"s2",image:"cobas-c111/modulo-1/comprobar-botellas.png",prompt:"Al abrir la pantalla Comprobar botellas, el sistema pregunta si el contenedor de agua está lleno y el de residuos vacío. ¿Cómo procedes?",choices:[{label:"Verificar físicamente los contenedores, llenar agua/vaciar residuos y luego confirmar con el check verde",correct:!0,next:"s3",feedback:"¡Excelente! Siempre debes realizar primero la acción física en los contenedores externos y después confirmar en pantalla."},{label:"Confirmar con el check verde sin revisar físicamente las botellas para ahorrar tiempo",correct:!1,feedback:"Incorrecto. Confirmar sin llenar el agua o vaciar los residuos puede provocar derrames o detención de la serie."}]},{id:"s3",image:"cobas-c111/modulo-1/mantenimiento-lista.png",prompt:"En la lista de Mantenimiento aparece una acción diaria pendiente marcada con alerta. ¿Qué haces?",choices:[{label:"Seleccionar la tarea de mantenimiento, ejecutarla y esperar a que quede confirmada",correct:!0,feedback:"¡Muy bien! Con las botellas verificadas, cubetas listas y el mantenimiento diario ejecutado, el equipo queda listo para calibración, controles y muestras."},{label:"Ignorar el mantenimiento diario y dejarlo para el turno de la tarde",correct:!1,feedback:"Incorrecto. Las tareas de mantenimiento pendientes deben ejecutarse antes de iniciar el procesamiento."}]}]},Eg={type:"checklist",instructions:"Marca únicamente las acciones que son correctas y seguras antes y durante la operación del analizador. Luego pulsa Comprobar.",items:[{text:"Usar el equipo de protección individual (EPP) adecuado.",correct:!0,feedback:"Correcto: el EPP es obligatorio en todas las actividades."},{text:"Mantener cerradas todas las cubiertas y tapas mientras el sistema está en funcionamiento.",correct:!0,feedback:"Correcto: nunca abras la cubierta con el equipo en movimiento."},{text:"Abrir la cubierta con el sistema en funcionamiento para observar el pipeteo.",correct:!1,feedback:"Incorrecto: antes de trabajar con una cubierta abierta, el sistema debe estar apagado o en estado Mantenimiento."},{text:"Si se derrama material biopeligroso, limpiarlo de inmediato y aplicar desinfectante.",correct:!0,feedback:"Correcto: cualquier derrame biopeligroso se atiende de inmediato."}]},zj={type:"match",instructions:"Une cada contenedor o elemento del analizador con su función o característica correspondiente.",items:[{left:"Contenedor blanco externo",right:"Almacena el agua desionizada del sistema",feedback:"El contenedor blanco corresponde al suministro de agua."},{left:"Contenedor amarillo externo",right:"Recoge los residuos líquidos biopeligrosos",feedback:"El contenedor amarillo almacena los residuos líquidos."},{left:"Botón Preparar",right:"Inicia el asistente guiado de preparación diaria",feedback:"El botón Preparar guía la revisión de fluidos, reactivos y cubetas."},{left:"Posición I del interruptor",right:"Enciende el suministro eléctrico del analizador",feedback:"I corresponde a encendido y O a apagado."}]},Vj={type:"order",instructions:"Ordena los pasos para el encendido e ingreso diario al analizador cobas c 111 (puedes arrastrar las tarjetas o usar las flechas).",items:[{text:"Verificar EPP, cubiertas cerradas, contenedores conectados y área de muestras vacía."},{text:"Colocar el interruptor principal de corriente en la posición I."},{text:"Esperar la inicialización sin tocar la pantalla hasta que indique En espera."},{text:"Seleccionar Acceder e ingresar nombre de usuario y contraseña personal."},{text:"Revisar alarmas, contenedores externos, cubetas, reactivos y mantenimiento pendiente."}]},Fs={"2.1":{objective:"Ejecutar el asistente guiado Preparar en la pestaña General para dejar el analizador cobas c 111 listo para la operación diaria.",warning:"Completa siempre primero la acción física en el equipo o contenedores antes de confirmar cada paso en la pantalla táctil.",steps:[{title:"Inicia el asistente Preparar",text:"En la pestaña General, con el equipo en estado En espera, selecciona el botón Preparar.",image:"cobas-c111/modulo-1/pantalla-general.png",note:"El asistente te guiará secuencialmente por fluidos, impresora, reactivos, cubetas, mantenimiento e ISE."},{title:"Comprueba botellas externas",text:"El asistente abre la ventana Comprobar botellas. Verifica el contenedor blanco de agua, el contenedor amarillo de residuos y el frasco de agente limpiador.",image:"cobas-c111/modulo-2/comprobar-botellas.png"},{title:"Revisa el disco de reactivos y mezcla solicitada",text:"Verifica las posiciones del disco de reactivos, retira o carga los frascos necesarios y realiza la mezcla suave de aquellos reactivos que el sistema indique.",image:"cobas-c111/modulo-2/disco-reactivos.png"},{title:"Verifica segmentos de cubetas y mantenimiento",text:"Comprueba que existan suficientes cubetas disponibles y ejecuta las tareas de mantenimiento diario listadas por el asistente.",image:"cobas-c111/modulo-2/cubetas.png"}]},"2.2":{objective:"Revisar, llenar, vaciar y conectar de forma biosegura los tres contenedores externos de fluidos: agua, residuos líquidos y agente limpiador.",warning:"Todos los residuos líquidos son potencialmente biopeligrosos. Utiliza siempre EPP completo y evita tocar el extremo inferior de los tubos adaptadores.",steps:[{title:"Contenedor externo de agua (blanco)",text:"Retira el adaptador de agua, llena el contenedor blanco con agua desionizada/destilada que cumpla la especificación del laboratorio y vuelve a colocar su adaptador.",image:"cobas-c111/modulo-2/contenedor-agua.png",note:"Revisa que el adaptador de agua ajuste firmemente sin fugas."},{title:"Adaptador del contenedor de agua",text:"Asegúrate de no contaminar el tubo de aspiración del adaptador al retirarlo o colocarlo.",image:"cobas-c111/modulo-2/adaptador-agua.png"},{title:"Contenedor externo de residuos (amarillo)",text:"Retira el adaptador de residuos, vacía y desecha el contenido siguiendo el protocolo de residuos biopeligrosos del laboratorio y reconecta el adaptador.",image:"cobas-c111/modulo-2/contenedor-residuos.png"},{title:"Agente limpiador (Cleaner)",text:"Verifica el nivel del frasco de agente limpiador, sustitúyelo si es necesario e inserta su adaptador verticalmente hasta que encaje.",image:"cobas-c111/modulo-2/agente-limpiador.png",note:"Después de intervenir cualquier botella, confírmalo en la pantalla Comprobar botellas."}]},"2.3":{type:"checklist",instructions:"Marca únicamente las prácticas correctas durante la verificación de agua, residuos y agente limpiador. Luego pulsa Comprobar.",items:[{text:"Llenar físicamente el contenedor de agua y vaciar el de residuos ANTES de pulsar el botón de confirmación en la pantalla Comprobar botellas.",correct:!0,feedback:"Correcto: confirmar en pantalla reinicia los contadores del software."},{text:"Tratar el contenido del contenedor amarillo de residuos como material biopeligroso usando EPP.",correct:!0,feedback:"Correcto: todo residuo líquido del analizador es biopeligroso."},{text:"Confirmar en pantalla que el contenedor de residuos está vacío sin haberlo vaciado físicamente para quitar la alerta roja.",correct:!1,feedback:"Incorrecto: esto provocará un desbordamiento de residuos biopeligrosos durante la serie."},{text:"Evitar tocar con las manos el tubo interno del adaptador de agua para prevenir contaminación.",correct:!0,feedback:"Correcto: protege la calidad del agua y evita obstrucciones."}]},"2.4":{intro:"Antes de iniciar el procesamiento diario debes verificar que la impresora térmica integrada tenga papel suficiente y se encuentre en estado operativo.",image:"cobas-c111/modulo-1/equipo-partes.png",hotspots:[],key_points:["Verifica que el rollo de papel térmico esté bien colocado, sin atascos y con longitud suficiente para el turno.","En la pantalla de estado del sistema, comprueba que el ícono de impresora no presente franja roja ni alerta de falta de papel.","Usa únicamente rollos de papel térmico compatibles con la impresora del analizador.","Si el papel muestra la línea roja de fin de rollo, reemplázalo antes de iniciar la corrida."]},"2.5":{objective:"Gestionar correctamente el disco de reactivos, consultar el detalle de determinaciones disponibles y ejecutar la mezcla de reactivos cuando el sistema lo solicite.",warning:"Evita la formación de espuma al mezclar un reactivo; las burbujas provocan errores de detección de nivel.",steps:[{title:"Consulta el estado del disco de reactivos",text:"Abre la vista del disco de reactivos para identificar las posiciones ocupadas, disponibles o con alerta de volumen bajo.",image:"cobas-c111/modulo-2/disco-reactivos.png"},{title:"Revisa el detalle de cada reactivo",text:"Toca la posición del reactivo para verificar pruebas restantes, lote y estabilidad a bordo.",image:"cobas-c111/modulo-2/reactivo-detalle.png"},{title:"Realiza la mezcla de reactivos solicitada",text:"Cuando aparezca la pantalla Mezcla de reactivos, retira el frasco indicado, mézclalo suavemente por inversión sin formar espuma, vuelve a colocarlo y confirma.",image:"cobas-c111/modulo-2/mezcla-reactivos.png"}]},"2.6":{objective:"Revisar el estado de los segmentos de cubetas de reacción y sustituir los segmentos agotados sin contaminar las ventanas ópticas.",warning:"Sujeta siempre el segmento de cubetas por la pestaña superior. Nunca toques con los dedos la parte inferior transparente de las cubetas.",steps:[{title:"Revisa el mapa de segmentos de cubetas",text:"En la pantalla Cubetas observa el color y estado de cada segmento del rotor de reacción.",image:"cobas-c111/modulo-2/cubetas.png"},{title:"Retira los segmentos usados y coloca nuevos",text:"Cuando el sistema lo indique, abre la tapa del rotor de cubetas, retira los segmentos agotados (deséchalos como residuo biopeligroso) e inserta segmentos nuevos tomándolos solo por la parte superior.",image:"cobas-c111/modulo-2/cubetas.png",note:"Confirma en pantalla cada segmento reemplazado."}]},"3.1":{intro:"La calibración establece la relación matemática entre la señal óptica medida por el fotómetro (o potencial en ISE) y la concentración del analito. Es indispensable para obtener resultados exactos.",image:"cobas-c111/modulo-3/calibraciones.png",hotspots:[],key_points:["Debes calibrar cuando se carga un nuevo lote de reactivo, cuando vence el intervalo de calibración o cuando el Control de Calidad sale fuera de rango.","Revisa diariamente la lista de Calibraciones en Área de trabajo para identificar solicitudes automáticas o manuales.","Nunca proceses muestras de pacientes si la calibración del analito ha fallado o está vencida."]},"3.2":{objective:"Preparar, reconstituir y acondicionar los materiales de calibración antes de cargarlos en el analizador.",warning:"Respeta estrictamente el volumen de reconstitución, el tiempo de reposo y la temperatura indicados en el inserto del calibrador.",steps:[{title:"Identifica el calibrador requerido",text:"En la pantalla de Calibraciones verifica el nombre y lote del calibrador que solicita cada prueba.",image:"cobas-c111/modulo-3/calibraciones.png"},{title:"Reconstituye o atempera sin burbujas",text:"Si el calibrador es liofilizado, reconstitúyelo con agua desionizada usando pipeta calibrada, deja reposar el tiempo del inserto y mezcla por rotación suave sin espuma.",note:"Asegúrate de que no queden burbujas en la superficie del tubo o copa antes de colocarlo en el equipo."}]},"3.3":{scenario:"Inicias la jornada y al revisar la pestaña Área de trabajo > Calibraciones observas que dos pruebas (Glucosa y Creatinina) aparecen con solicitud automática de calibración por cambio de lote de reactivo.",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-3/calibraciones.png",prompt:"En la pantalla de Calibraciones ves las pruebas resaltadas que requieren calibración. ¿Cuál es tu primer paso antes de pulsar inicio?",choices:[{label:"Verificar qué calibradores pide el sistema, reconstituirlos o atemperarlos según el inserto y comprobar que no estén vencidos",correct:!0,next:"s2",feedback:"¡Correcto! Antes de cargar cualquier calibrador en el equipo debes verificar lote, fecha de vencimiento, tiempo de estabilidad tras reconstitución y homogeneización sin burbujas."},{label:"Colocar agua destilada en las posiciones de muestra para que el equipo calibre en blanco todas las pruebas",correct:!1,feedback:"Incorrecto. Cada método requiere su calibrador específico (p. ej. C.f.a.s.) indicado en la pantalla de Calibraciones."},{label:"Ignorar la solicitud de calibración y procesar primero las muestras urgentes del día",correct:!1,feedback:"Incorrecto. Con un lote sin calibración válida los resultados de pacientes no son confiables."}]},{id:"s2",image:"cobas-c111/modulo-1/pantalla-general.png",prompt:"El sistema te indica la posición donde debes colocar el calibrador en el área de muestras y el LED de la posición parpadea en verde. ¿Cómo colocas el tubo o copa?",choices:[{label:"Colocar el calibrador sin espuma ni burbujas en la posición indicada mientras el LED esté en verde y confirmar en pantalla",correct:!0,next:"s3",feedback:"¡Exacto! Las burbujas en la superficie pueden provocar error de detección de nivel o aspiración incompleta."},{label:"Agitar vigorosamente el calibrador hasta formar espuma y meterlo cuando el LED esté en rojo",correct:!1,feedback:"Incorrecto. Nunca introduzcas tubos cuando el LED esté en rojo ni con espuma superficial."}]},{id:"s3",image:"cobas-c111/modulo-3/calibraciones.png",prompt:"El analizador finaliza el pipeteo del calibrador y entra en fase de incubación y lectura fotométrica. ¿Qué debes hacer ahora?",choices:[{label:"Esperar a que finalice la medición, retirar el calibrador cuando el sistema lo indique y pasar a validar el resultado de la curva",correct:!0,feedback:"¡Excelente! Una vez terminada la lectura debes revisar que la calibración no presente banderas de error antes de correr el control de calidad."},{label:"Abrir la tapa principal del analizador para verificar visualmente el color de las cubetas",correct:!1,feedback:"Incorrecto. Abrir la cubierta durante la medición detiene la serie e invalida la calibración."}]}]},"3.4":{scenario:"PROBLEMA REAL DE CALIBRACIÓN: Acaba de terminar la calibración de un analito en el cobas c 111, pero en la pantalla de Calibraciones aparece marcada en rojo con una alarma de error de calibración (no linealidad / diferencia de duplicados).",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-3/calibraciones.png",prompt:"La calibración salió rechazada con bandera de error. Un compañero sugiere aceptar la calibración anterior vencida y empezar a pasar pacientes. ¿Qué haces?",choices:[{label:"No procesar pacientes para ese analito y abrir el detalle de la calibración para identificar el código y causa del error",correct:!0,next:"s2",feedback:"¡Correcto! Nunca se deben procesar muestras de pacientes con una calibración fallida."},{label:"Procesar las muestras de pacientes de todas formas y restarles un porcentaje manualmente",correct:!1,feedback:"Incorrecto. Eso invalida por completo la trazabilidad analítica del resultado."}]},{id:"s2",image:"cobas-c111/modulo-2/reactivo-detalle.png",prompt:"Al revisar las posibles causas físicas encuentras que el reactivo recién cargado no fue mezclado cuando el sistema lo solicitó y la copa del calibrador tenía una burbuja. ¿Cuál es el procedimiento correctivo?",choices:[{label:"Realizar la mezcla de reactivos requerida, verificar el volumen y ausencia de burbujas en el calibrador y repetir la calibración",correct:!0,next:"s3",feedback:"¡Muy bien! Corregir la causa raíz (homogeneidad del reactivo y ausencia de burbujas en el calibrador) evita que el error se repita."},{label:"Apagar el equipo del interruptor principal O sin cerrar sesión",correct:!1,feedback:"Incorrecto. Apagar bruscamente el equipo no corrige un problema de reactivo o calibrador y puede dañar la base de datos."}]},{id:"s3",image:"cobas-c111/modulo-3/calibraciones.png",prompt:"Tras repetir la calibración, el resultado aparece sin alarmas y dentro de los criterios de aceptación. ¿Cuál es el paso obligatorio siguiente antes de analizar muestras de pacientes?",choices:[{label:"Validar/aceptar la calibración y procesar los dos niveles de Control de Calidad interno para confirmar la exactitud",correct:!0,feedback:"¡Perfecto! Toda calibración exitosa debe verificarse obligatoriamente corriendo el Control de Calidad interno antes de liberar resultados de pacientes."},{label:"Pasar directamente las muestras de pacientes sin correr controles para recuperar el tiempo perdido",correct:!1,feedback:"Incorrecto. Sin un control de calidad aprobado posterior a la calibración no puedes garantizar que la curva esté bien ajustada."}]}]},"3.5":{objective:"Procesar los materiales de Control de Calidad interno (normal y patológico) al inicio de la jornada o tras una calibración.",warning:"No inicies el procesamiento de muestras clínicas hasta haber verificado y validado los resultados del Control de Calidad.",steps:[{title:"Prepara los niveles de control",text:"Atempera los controles internos (Nivel 1 y Nivel 2), homogenéalos suavemente sin formar espuma y verifica su lote y estabilidad."},{title:"Solicita y carga los controles",text:"En el menú de Control de Calidad selecciona los controles requeridos, colócalos en las posiciones de muestra indicadas cuando el LED esté en verde y confirma.",image:"cobas-c111/modulo-1/pantalla-general.png"}]},"3.6":{scenario:"PROBLEMA REAL EN CONTROL DE CALIDAD: Procesas los controles internos Nivel 1 (normal) y Nivel 2 (patológico). El Nivel 1 entra en rango, pero el Nivel 2 de Glucosa arroja una alarma fuera de rango (> +3 DE).",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-1/pantalla-general.png",prompt:"Tienes 15 muestras de pacientes esperando para Glucosa y el Control Nivel 2 salió fuera de rango (+3 DE). ¿Qué decisión tomas de inmediato?",choices:[{label:"Retener el procesamiento de Glucosa para pacientes e iniciar la investigación de la falla del control Nivel 2",correct:!0,next:"s2",feedback:"¡Correcto! Como un nivel de control violó la regla de rechazo (> 3 DE), el método no está bajo control estadístico."},{label:"Como el Nivel 1 sí dio bien, procesar los pacientes cuya glucosa creas que va a salir normal",correct:!1,feedback:"Incorrecto. Ambos niveles de control deben estar dentro de los límites aceptables antes de procesar muestras clínicas."}]},{id:"s2",image:"cobas-c111/modulo-2/disco-reactivos.png",prompt:"Al inspeccionar el vial del control Nivel 2 notas que llevaba abierto en el mesón desde el día anterior y pudo haberse concentrado por evaporación. ¿Qué haces?",choices:[{label:"Preparar o servir una alícuota fresca de Control Nivel 2 bien conservada, verificar el estado del reactivo en el disco y repetir el control",correct:!0,next:"s3",feedback:"¡Excelente criterio! La evaporación del suero control en copas abiertas concentra los analitos y produce errores sistemáticos altos (+3 DE)."},{label:"Diluir el control viejo con agua de la llave hasta que dé dentro del rango",correct:!1,feedback:"Incorrecto. Nunca se altera ni diluye arbitrariamente un material de control para forzar que entre en rango."}]},{id:"s3",image:"cobas-c111/modulo-3/calibraciones.png",prompt:"Si con una alícuota nueva de control el valor sigue fuera de rango, ¿cuál es el siguiente paso técnico antes de liberar el método?",choices:[{label:"Recalibrar la prueba, volver a pasar ambos niveles de control, validar que entren en rango y registrar la acción correctiva",correct:!0,feedback:"¡Correcto! Si el control fresco persiste fuera de rango, se recalibra el método, se reevalúan los controles y se documenta en la bitácora de CC."},{label:"Cambiar los rangos del control en el software para que el valor aparezca en verde",correct:!1,feedback:"Incorrecto. Los límites de control solo los define la coordinación de calidad según la media y DE establecidas."}]}]},"4.1":{intro:"El analizador cobas c 111 procesa muestras de suero, plasma, orina y sangre total con EDTA (según el método). La calidad preanalítica de la muestra es determinante para evitar obstrucciones de aguja y errores fotométricos.",image:"cobas-c111/modulo-1/equipo-partes.png",hotspots:[],key_points:["Asegúrate de que las muestras estén completamente centrifugadas y libres de coágulos, hilos de fibrina o burbujas superficiales.","Revisa que el volumen de muestra en el tubo primario o copa sea suficiente considerando el volumen muerto.","Identifica si existen interferencias visibles (hemólisis, ictericia o lipemia severa) antes de cargar el tubo."]},"4.2":{objective:"Identificar las muestras mediante el lector de código de barras o ingreso manual y seleccionar las pruebas solicitadas en la orden.",steps:[{title:"Abre la ventana Orden o STAT",text:"En la pestaña General selecciona Orden para muestras rutinarias o STAT para urgencias.",image:"cobas-c111/modulo-1/pantalla-general.png"},{title:"Escanea o ingresa el ID de la muestra",text:"Lee el código de barras del tubo con el lector manual o digita el identificador verificando que coincida con la solicitud clínica, y marca los exámenes a procesar."}]},"4.3":{objective:"Cargar y procesar muestras rutinarias en las 8 posiciones del área de muestras.",steps:[{title:"Selecciona Orden en la pestaña General",text:"Registra el ID de muestra y selecciona el perfil o pruebas requeridas.",image:"cobas-c111/modulo-1/pantalla-general.png"},{title:"Coloca el tubo cuando el LED lo indique",text:"Introduce el tubo sin tapa y sin burbujas en la posición asignada cuando el indicador LED esté en verde y confirma."}]},"4.4":{objective:"Procesar muestras urgentes (STAT) con prioridad sobre la serie rutinaria en curso.",steps:[{title:"Pulsa el botón STAT en la pantalla General",text:"Al pulsar STAT, el sistema habilita el registro prioritario de la muestra de urgencia.",image:"cobas-c111/modulo-1/pantalla-general.png"},{title:"Carga el tubo STAT en la posición asignada",text:"Escanea el tubo, selecciona los exámenes urgentes y colócalo en la posición libre con LED verde."}]},"4.5":{type:"order",instructions:"Ordena correctamente los pasos para cargar y retirar un tubo de muestra en el cobas c 111.",items:[{text:"Verificar que la muestra no tenga coágulos, fibrina ni burbujas y que tenga volumen suficiente."},{text:"Seleccionar Orden (o STAT), escanear el código de barras del tubo y marcar las pruebas."},{text:"Colocar el tubo en la posición asignada únicamente cuando su indicador LED esté en verde."},{text:"Retirar el tubo procesado cuando el sistema haya finalizado la aspiración y el LED de la posición lo permita."}]},"4.6":{scenario:"PROBLEMA REAL EN PROCESAMIENTO DE MUESTRAS: El cobas c 111 está procesando una serie de 6 muestras rutinarias. De repente llega una muestra urgente (STAT) de Urgencias con el código de barras manchado y húmedo.",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-1/pantalla-general.png",prompt:"Necesitas dar prioridad a la muestra de Urgencias mientras el equipo está corriendo rutina. ¿Qué función de la pantalla General utilizas?",choices:[{label:"Seleccionar el botón STAT en la pestaña General para registrar la orden con prioridad de urgencia",correct:!0,next:"s2",feedback:"¡Correcto! El botón STAT permite ingresar muestras prioritarias para que el analizador las procese con preferencia."},{label:"Apagar el interruptor eléctrico del analizador para sacar todas las muestras rutinarias",correct:!1,feedback:"Incorrecto. Si apagas el equipo perderás todas las reacciones en curso de los demás pacientes."}]},{id:"s2",image:"cobas-c111/modulo-1/equipo-partes.png",prompt:"Al pasar el lector de código de barras de mano sobre el tubo STAT, el lector no lo lee porque la etiqueta está manchada. ¿Cómo procedes de forma segura?",choices:[{label:"Verificar la identificación del paciente en el tubo, ingresar el ID de la muestra manualmente en la pantalla de orden STAT (o reetiquetar según protocolo), verificar que no tenga fibrina ni burbujas y cargarla en la posición libre con LED verde",correct:!0,next:"s3",feedback:"¡Muy bien! Cuando el código de barras no es legible, puedes digitar el ID de muestra en pantalla verificando dos veces la trazabilidad del paciente."},{label:"Ponerle la etiqueta de otro paciente cuyo código sí lea el escáner",correct:!1,feedback:"¡Error crítico! Usar la identificación de otro paciente genera una suplantación de resultados clínicos."}]},{id:"s3",image:"cobas-c111/modulo-1/pantalla-general.png",prompt:"¿En qué momento puedes retirar un tubo ya procesado o colocar el tubo STAT en una posición del rotor de muestras?",choices:[{label:"Únicamente cuando el indicador LED de esa posición específica lo permita y la pantalla lo indique",correct:!0,feedback:"¡Exacto! Respetar la señal luminosa (LED) de cada una de las 8 posiciones evita colisiones con la aguja de pipeteo."},{label:"En cualquier momento, incluso mientras la aguja está bajando a pipetear en esa posición",correct:!1,feedback:"Incorrecto. Introducir la mano o un tubo cuando la aguja se desplaza puede doblar la aguja y lesionar al operador."}]}]},"5.1":{intro:"En la pestaña Área de trabajo puedes consultar en tiempo real el listado de órdenes y resultados de muestras y controles.",image:"cobas-c111/modulo-1/pantalla-general.png",hotspots:[],key_points:["Filtra o selecciona la orden del paciente para visualizar todos los analitos medidos, sus unidades y estado de validación.","Revisa que no queden pruebas en estado pendiente antes de dar por cerrada una orden."]},"5.2":{intro:"El analizador acompaña los resultados numéricos con indicadores o banderas (flags) cuando detecta valores fuera del rango de referencia, fuera de linealidad o problemas fotométricos/de muestra.",image:"cobas-c111/modulo-1/pantalla-general.png",hotspots:[],key_points:["Un resultado con bandera de alarma técnica nunca debe aceptarse a ciegas: abre el detalle para leer la descripción de la alarma.","Diferencia entre banderas de rango biológico (valores altos o bajos del paciente) y banderas analíticas (interferencia, agotamiento de sustrato, falta de muestra)."]},"5.3":{objective:"Revisar y aceptar en el sistema los resultados analíticos que cumplen los criterios de calidad.",steps:[{title:"Selecciona el resultado en Área de trabajo",text:"Revisa la coherencia del resultado, unidades y ausencia de alarmas analíticas.",image:"cobas-c111/modulo-1/pantalla-general.png"},{title:"Confirma y acepta el resultado",text:"Pulsa la opción Aceptar para validar el resultado y habilitar su impresión o envío al sistema de información del laboratorio (LIS)."}]},"5.4":{scenario:"PROBLEMA REAL EN VALIDACIÓN DE RESULTADOS: Al revisar los resultados terminados en Área de trabajo, un paciente presenta un resultado de Transaminasa / Glucosa con una bandera de alarma por concentración superior al límite de linealidad del método.",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-1/pantalla-general.png",prompt:"El resultado tiene una bandera de alarma que indica que superó el rango lineal de medición (agotamiento de sustrato / absorbancia fuera de límite). ¿Debes aceptarlo y reportarlo así?",choices:[{label:"No aceptarlo todavía: revisar el detalle de la bandera, verificar el estado de la muestra (hemólisis, lipemia, ictericia o coágulos) y programar repetición con dilución",correct:!0,next:"s2",feedback:"¡Correcto! Un resultado con alarma de linealidad no debe liberarse sin antes verificar la muestra y reprocesar con la dilución indicada en el método."},{label:"Aceptar y transmitir el número tal como salió, ignorando la bandera de alarma del equipo",correct:!1,feedback:"Incorrecto. Cuando se supera la linealidad, el valor numérico crudo puede estar subestimado o ser inexacto."}]},{id:"s2",image:"cobas-c111/modulo-2/reactivo-detalle.png",prompt:"Inspeccionas el tubo del paciente y el suero está límpido, sin fibrina ni hemólisis, por lo que realmente se trata de una concentración muy elevada del analito. ¿Qué acción ejecutas?",choices:[{label:"Reprocesar la prueba aplicando el factor de dilución recomendado en el inserto del reactivo y multiplicar (o verificar que el sistema calcule) el resultado final",correct:!0,next:"s3",feedback:"¡Muy bien! La dilución lleva la concentración de la muestra dentro del rango lineal del fotómetro."},{label:'Reportar "Muestra dañada" sin repetir la prueba',correct:!1,feedback:"Incorrecto. La muestra está en buenas condiciones; solo requiere dilución por concentración alta."}]},{id:"s3",image:"cobas-c111/modulo-1/pantalla-general.png",prompt:"El resultado reprocesado tras la dilución ya no presenta banderas de alarma y es coherente con la clínica del paciente. ¿Cómo finalizas?",choices:[{label:"Seleccionar el resultado válido, pulsar Aceptar para validarlo y autorizar su impresión o transmisión al sistema del laboratorio",correct:!0,feedback:"¡Excelente! Solo los resultados revisados, sin alarmas críticas y aceptados por el profesional pasan al reporte clínico."},{label:"Borrar la orden del paciente para que no quede registro en el equipo",correct:!1,feedback:"Incorrecto. Nunca se deben borrar órdenes válidas antes de transmitirlas y respaldarlas."}]}]},"5.5":{intro:"Una vez validados los resultados en el cobas c 111, pueden imprimirse en la impresora integrada, exportarse o transmitirse al sistema de información del laboratorio (host/LIS) cuando la interfaz esté habilitada.",image:"cobas-c111/modulo-6/fin-turno-exportar.png",hotspots:[],key_points:["Verifica que todos los resultados validados del turno hayan sido transmitidos o impresos antes de iniciar el asistente Fin turno.","También puedes exportar archivos de datos desde Utilidades o durante el asistente Fin turno."]},"6.1":{objective:"Detener de manera segura una serie en curso utilizando la función Parar > Interrumpir.",steps:[{title:"Pulsa el botón global Parar",text:"Cuando necesites detener el procesamiento, pulsa el botón Parar en la barra inferior.",image:"cobas-c111/modulo-6/parar-interrumpir.png"},{title:"Selecciona Interrumpir y confirma",text:"Elige Interrumpir para detener la serie de forma controlada y espera a que el estado del sistema pase a En espera.",image:"cobas-c111/modulo-6/parar-interrumpir.png"}]},"6.2":{objective:"Ejecutar la recuperación mecánica del analizador (Parar > Recuperar) cuando un componente queda fuera de su posición inicial.",steps:[{title:"Abre la ventana Parar > Recuperar",text:"Si tras una incidencia o parada el sistema solicita recuperar los mecanismos, selecciona la pestaña Recuperar dentro de la ventana Parar.",image:"cobas-c111/modulo-6/parar-recuperar.png"},{title:"Ejecuta la recuperación y espera al estado En espera",text:"Confirma la acción para que el analizador reposicione automáticamente la unidad de pipeteo y los rotores.",image:"cobas-c111/modulo-6/parar-recuperar.png"}]},"6.3":{type:"checklist",instructions:"Marca las verificaciones que debes realizar sobre las órdenes antes de iniciar el cierre de turno.",items:[{text:"Comprobar en Área de trabajo que no existan órdenes en estado pendiente o en proceso.",correct:!0,feedback:"Correcto: todas las muestras del turno deben haber concluido."},{text:"Retirar todos los tubos de muestras de las 8 posiciones del área de muestras.",correct:!0,feedback:"Correcto: el área de muestras debe quedar libre al cerrar el turno."},{text:"Iniciar Fin de turno mientras todavía hay muestras STAT siendo pipeteadas.",correct:!1,feedback:"Incorrecto: nunca cierres el turno con muestras en curso."}]},"6.4":{type:"checklist",instructions:"Marca las acciones correctas respecto a los resultados antes de depurar la base de datos al final del turno.",items:[{text:"Revisar y validar todos los resultados pendientes en Área de trabajo.",correct:!0,feedback:"Correcto: ningún resultado clínico debe quedar sin revisar."},{text:"Confirmar que las repeticiones o diluciones necesarias ya se hayan procesado y aceptado.",correct:!0,feedback:"Correcto."},{text:"Borrar las órdenes del día sin revisar si tenían resultados pendientes de validar.",correct:!1,feedback:"Incorrecto: borrar órdenes sin validar implica pérdida de resultados de pacientes."}]},"6.5":{objective:"Ejecutar paso a paso el asistente Fin turno para el mantenimiento final, retiro de consumibles y cierre de la jornada.",steps:[{title:"Selecciona Fin turno en la pestaña General",text:"Con el sistema En espera y sin órdenes pendientes, pulsa el botón Fin turno.",image:"cobas-c111/modulo-6/pantalla-fin-turno.png"},{title:"Ejecuta las tareas de mantenimiento de fin de turno",text:"Realiza las acciones de lavado y mantenimiento diario que presenta el asistente.",image:"cobas-c111/modulo-6/fin-turno-mantenimiento.png"},{title:"Retira o verifica segmentos de cubetas usados",text:"Retira los segmentos de cubetas utilizados siguiendo la indicación de la pantalla.",image:"cobas-c111/modulo-6/fin-turno-cubetas.png"},{title:"Depuración de archivos antiguos",text:"Una vez respaldados y exportados los datos, confirma el borrado de archivos antiguos sugerido por el asistente.",image:"cobas-c111/modulo-6/fin-turno-borrar.png"}]},"6.6":{objective:"Realizar la copia de seguridad y la exportación de datos durante el cierre de turno.",steps:[{title:"Realiza la copia de seguridad (Backup)",text:"En el paso Copia de seguridad del asistente Fin turno, inserta el medio de almacenamiento (USB) o selecciona el destino y confirma el respaldo.",image:"cobas-c111/modulo-6/fin-turno-copia.png"},{title:"Exporta los archivos de resultados y control de calidad",text:"En el paso Exportar archivos, transfiere los registros del turno para garantizar su trazabilidad.",image:"cobas-c111/modulo-6/fin-turno-exportar.png"}]},"7.1":{objective:"Consultar y ejecutar las actividades de mantenimiento rutinario (diario, semanal, mensual o según contador) del analizador cobas c 111.",warning:"El sistema debe estar en estado En espera o Mantenimiento antes de ejecutar cualquier rutina de mantenimiento.",steps:[{title:"Abre la lista de Mantenimiento",text:"Desde la pestaña General o Utilidades > Mantenimiento, revisa las tareas programadas y aquellas que aparecen vencidas o con indicador de alerta.",image:"cobas-c111/modulo-2/mantenimiento-lista.png"},{title:"Selecciona la tarea y sigue las instrucciones en pantalla",text:"Elige la acción de mantenimiento pendiente (por ejemplo, lavado del sistema o comprobación de aguja), coloca las soluciones requeridas si lo solicita y confirma su ejecución.",image:"cobas-c111/modulo-6/fin-turno-mantenimiento.png",note:"Al finalizar cada rutina, el indicador de estado de mantenimiento se actualiza automáticamente."}]},"7.2":{objective:"Realizar la limpieza y desinfección segura de las superficies externas, área de muestras, compartimento de reactivos y contenedores.",warning:"Antes de trabajar con una cubierta abierta, asegúrate de que el analizador esté apagado o en estado Mantenimiento. No derrames líquidos dentro del equipo.",steps:[{title:"Prepara el equipo y colócate el EPP",text:"Con guantes, bata y protección ocular, verifica que el analizador esté en estado Mantenimiento o apagado.",image:"cobas-c111/modulo-1/equipo-partes.png"},{title:"Limpia superficies externas y área de muestras",text:"Utiliza un paño suave ligeramente humedecido con la solución limpiadora/desinfectante aprobada en el instructivo para limpiar las cubiertas, el soporte de muestras y el exterior de los contenedores.",note:"Si ocurre un derrame de material biopeligroso durante el turno, límpialo y desinféctalo de inmediato."}]},"7.3":{objective:"Verificar el estado y ejecutar el mantenimiento preventivo de la unidad ISE (electrolitos: Na⁺, K⁺ y Cl⁻), cuando esté instalada en el analizador.",steps:[{title:"Consulta el panel Estado de la ISE",text:"Abre la ventana Estado de la ISE para revisar el nivel de los reactivos ISE, el estado de los electrodos y la calibración ISE.",image:"cobas-c111/modulo-2/estado-ise.png"},{title:"Ejecuta el lavado y acondicionamiento ISE",text:"Realiza las rutinas de limpieza/activación de electrodos ISE en los intervalos definidos en la lista de Mantenimiento.",image:"cobas-c111/modulo-2/mantenimiento-lista.png"}]},"7.4":{scenario:"SIMULACIÓN DE CONTINGENCIA REAL EN TURNO: Mientras el cobas c 111 procesa muestras, el indicador de estado cambia a ROJO y aparece una alarma crítica: el contenedor externo de residuos líquidos llegó a su límite y además debes detener la serie de forma controlada.",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-6/parar-interrumpir.png",prompt:'Necesitas detener el muestreo en curso para atender la alarma sin perder las pruebas que ya fueron pipeteadas en las cubetas. Al pulsar el botón global Parar, aparecen las opciones "Interrumpir" y "Recuperar". ¿Cuál eliges?',choices:[{label:"Seleccionar Parar > Interrumpir para que deje de aspirar muestras nuevas o se detenga de forma controlada según la urgencia",correct:!0,next:"s2",feedback:"¡Correcto! La ventana Parar permite Interrumpir la serie de manera controlada para atender una incidencia en el analizador."},{label:"Desenchufar el cable de energía de la pared inmediatamente",correct:!1,feedback:"Incorrecto. Desconectar la corriente deja la aguja y los mecanismos fuera de su posición de reposo y pierde los datos en memoria."}]},{id:"s2",image:"cobas-c111/modulo-2/contenedor-residuos.png",prompt:"Una vez el equipo está en estado seguro (En espera / detenido), vas a vaciar el contenedor amarillo de residuos líquidos. ¿Qué medidas de bioseguridad y procedimiento aplicas?",choices:[{label:"Con EPP completo, retirar el adaptador de residuos con cuidado, tratar el líquido como material biopeligroso según el PGIRASA, reconectar el adaptador y confirmar en Comprobar botellas",correct:!0,next:"s3",feedback:"¡Muy bien! Todos los residuos líquidos del analizador son potencialmente biopeligrosos y después de vaciar el contenedor debes confirmarlo en pantalla."},{label:"Confirmar en la pantalla que el contenedor está vacío sin vaciarlo físicamente para que se quite la alarma roja",correct:!1,feedback:"¡Peligro! Si engañas al contador del software sin vaciar el contenedor amarillo, los residuos biopeligrosos se desbordarán en el laboratorio."}]},{id:"s3",image:"cobas-c111/modulo-6/parar-recuperar.png",prompt:"Si durante una parada de emergencia un mecanismo quedó fuera de su posición inicial y el sistema solicita recuperar los componentes mecánicos, ¿qué opción utilizas?",choices:[{label:"Seleccionar Parar > Recuperar y esperar a que el analizador lleve la unidad de pipeteo y el rotor a su posición inicial",correct:!0,next:"s4",feedback:"¡Exacto! La función Recuperar reposiciona de forma automática y segura los mecanismos internos del equipo."},{label:"Empujar la aguja de pipeteo con la mano hasta llevarla a la esquina",correct:!1,feedback:"Incorrecto. Mover la unidad de pipeteo con la mano puede desalinear los motores paso a paso o pincharte con la aguja."}]},{id:"s4",image:"cobas-c111/modulo-2/estado-ise.png",prompt:"Si la alarma de hardware o unidad ISE persiste después de aplicar los pasos del instructivo, ¿por cuál canal oficial debes reportar la falla y solicitar servicio técnico?",choices:[{label:"Suspender el uso del equipo, registrar el código de alarma y reportar la falla en la plataforma navify® Portal de Roche (https://navifyportal.roche.com)",correct:!0,feedback:"¡Perfecto! Toda solicitud de servicio técnico y reporte de fallas del analizador se realiza a través de navify® Portal (https://navifyportal.roche.com) adjuntando el código de error y número de serie."},{label:"Desarmar la carcasa interna con un destornillador para reparar las tarjetas electrónicas por cuenta propia",correct:!1,feedback:"Incorrecto. El personal del laboratorio nunca debe intervenir componentes internos no autorizados."}]}]},"7.5":{intro:"Cuando se presenta una falla técnica o alarma en el analizador cobas c 111 que no se resuelve con los procedimientos operativos del instructivo (Parar > Recuperar, cambio de consumibles o mantenimiento rutinario), el reporte de la falla y la solicitud de servicio técnico se deben realizar a través de la página oficial navify® Portal (Roche): https://navifyportal.roche.com",external_link:{title:"navify® Portal (Roche) · Reporte de Fallas y Servicio Técnico",url:"https://navifyportal.roche.com",button_label:"Abrir navify® Portal (Roche)",description:"Ten siempre presente esta página para reportar cualquier falla del equipo cobas c 111, crear el ticket de servicio técnico con el código de alarma y hacer seguimiento a la visita o soporte del ingeniero."},image:"cobas-c111/modulo-6/parar-recuperar.png",hotspots:[],key_points:["Canal oficial de reporte: Todas las solicitudes de servicio técnico se gestionan por la página de navify® Portal (Roche): https://navifyportal.roche.com","Cuándo reportar la falla en navify® Portal: 1) Cuando una alarma de instrumento persiste tras ejecutar las acciones correctivas del instructivo; 2) Cuando hay daño físico en la aguja de pipeteo, fugas internas o fallas ópticas/mecánicas; 3) Cuando las calibraciones o controles fallan repetidamente pese a usar reactivos, calibradores y controles nuevos.","Datos que debes tener a la mano al ingresar a https://navifyportal.roche.com: Número de serie (S/N) o ID del analizador cobas c 111, código y texto exacto del error en pantalla, lote de reactivo/calibrador (si es falla analítica) y resumen de las pruebas ya realizadas en el laboratorio.","Mientras se atiende el caso por servicio técnico, deja el equipo en estado seguro, coloca la señalización correspondiente, registra el evento en la bitácora del equipo y activa el plan de contingencia del laboratorio clínico."]},"8.1":{scenario:"CASO REAL 1 · Alerta simultánea de botellas externas: Al iniciar la preparación matutina, la pantalla General muestra el botón de fluidos con franja roja. Al abrirlo, tanto el contenedor de agua como el de agente limpiador y residuos requieren intervención.",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-2/comprobar-botellas.png",prompt:'Se abre la ventana "Comprobar botellas" mostrando agua vacía, residuos llenos y agente limpiador bajo. ¿Cuál es la regla de oro antes de tocar los botones de confirmación en pantalla?',choices:[{label:"Realizar primero el llenado/vaciado físico de cada botella externa y solo después pulsar el botón de confirmación correspondiente en pantalla",correct:!0,next:"s2",feedback:"¡Correcto! Confirmar en la pantalla reinicia los contadores internos del software; si no haces primero el cambio físico, el equipo trabajará sin agua o rebosará residuos."},{label:"Pulsar el check verde en la pantalla de inmediato y dejar el llenado físico para el final de la mañana",correct:!1,feedback:"Incorrecto. Si el equipo aspira aire por falta de agua, fallarán todas las diluciones y lavados de aguja."}]},{id:"s2",image:"cobas-c111/modulo-2/contenedor-agua.png",prompt:"Vas a llenar el contenedor blanco de agua. ¿Qué precaución debes tener con el adaptador y la calidad del agua?",choices:[{label:"Retirar el adaptador sin contaminar el tubo de aspiración, llenar con agua desionizada/destilada que cumpla la especificación del laboratorio y volver a ajustar el adaptador",correct:!0,next:"s3",feedback:"¡Muy bien! El tubo del adaptador de agua debe mantenerse limpio para evitar crecimiento bacteriano o partículas que obstruyan la aguja."},{label:"Llenarlo con solución salina o agua del grifo sin desconectar el adaptador",correct:!1,feedback:"Incorrecto. Los iones y minerales del agua del grifo o solución salina alteran la fotometría y los blancos de cubeta."}]},{id:"s3",image:"cobas-c111/modulo-2/agente-limpiador.png",prompt:"También debes reemplazar la botella de agente limpiador (cobas c 111 Cleaner). ¿Cómo lo instalas correctamente?",choices:[{label:"Colocar un frasco nuevo de agente limpiador sin vencimiento, insertar su adaptador verticalmente hasta que encaje y confirmar en la pantalla Comprobar botellas",correct:!0,feedback:"¡Excelente! Con agua, residuos y agente limpiador verificados físicamente y confirmados en pantalla, el sistema de fluidos queda listo."},{label:"Rellenar el frasco vacío de agente limpiador con jabón líquido de manos",correct:!1,feedback:"¡Error grave! Usar detergentes no especificados deja residuos ópticos en las cubetas y daña las tuberías."}]}]},"8.2":{scenario:"CASO REAL 2 · Problema en disco de reactivos y segmentos de cubetas: El asistente Preparar te advierte que un reactivo recién colocado requiere mezcla obligatoria y que un segmento de cubetas está completamente usado (en rojo).",start:"s1",screens:[{id:"s1",image:"cobas-c111/modulo-2/disco-reactivos.png",prompt:"En la pantalla del disco de reactivos observas posiciones con alerta. Al tocar una posición, ves el detalle del frasco. ¿Qué información crítica debes revisar?",choices:[{label:"Verificar el número de determinaciones restantes, la estabilidad a bordo, si solicita mezcla y que no tenga alerta de vencimiento",correct:!0,next:"s2",feedback:"¡Correcto! La vista de detalle del reactivo te permite anticipar si alcanzará para las muestras del turno o si requiere acción inmediata."},{label:"Sacar el disco de reactivos a la fuerza mientras el rotor está girando",correct:!1,feedback:"Incorrecto. Solo se manipula el disco cuando el asistente o el estado del equipo lo permiten con la tapa desbloqueada."}]},{id:"s2",image:"cobas-c111/modulo-2/mezcla-reactivos.png",prompt:'La pantalla muestra "Mezcla de reactivos" solicitando retirar y homogeneizar un frasco específico. ¿Cómo debes mezclarlo?',choices:[{label:"Retirar el frasco indicado, mezclarlo suavemente por inversión/rotación según la instrucción sin formar espuma, volver a colocarlo y confirmar",correct:!0,next:"s3",feedback:"¡Exacto! Algunos reactivos sedimentan partículas o látex y requieren mezcla suave sin generar burbujas antes de usarse."},{label:"Agitarlo fuertemente como una coctelera durante 1 minuto hasta llenarlo de espuma",correct:!1,feedback:"Incorrecto. La espuma en el frasco de reactivo causa errores de sensor de nivel y pipeteo de aire."}]},{id:"s3",image:"cobas-c111/modulo-2/cubetas.png",prompt:"Ahora pasas a la pantalla de Cubetas y ves segmentos agotados. ¿Cómo realizas el cambio de los segmentos de cubetas?",choices:[{label:"Sustituir los segmentos usados por segmentos nuevos sujetándolos solo por la pestaña superior (sin tocar las ventanas ópticas inferiores), encajarlos bien y confirmar en p
